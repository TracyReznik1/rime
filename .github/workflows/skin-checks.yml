name: Skin extension checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skin-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          python -m pip install -r tools/requirements-skin.txt
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check public files
        shell: pwsh
        run: |
          git diff --check
          python tools/check-public-tree.py
  manager:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./tools/build-manager.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WeaselSkinManager
          path: work/manager-dist/WeaselSkinManager/
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: deps/boost_1_84_0
          key: boost-1.84.0-v143-x64-${{ runner.os }}-v1
      - shell: pwsh
        run: ./tools/prepare-native.ps1
      - shell: pwsh
        run: |
          ./tools/build-local.ps1 native-test
          ./tools/build-local.ps1 first-key-test
          ./tools/build-local.ps1 tsf
          ./tools/build-local.ps1 server
          python -m pip install -r tools/requirements-skin.txt
          python tools/make-test-skin.py --output work/test-skin
          ./work/skin_native.exe "$PWD\work\test-skin\active.ini" "$PWD\work"
          if ($LASTEXITCODE) { throw 'Native renderer failed' }
          ./work/skin_first_key.exe stress
          if ($LASTEXITCODE) { throw 'Composition resource regression' }
      - uses: actions/upload-artifact@v4
        with:
          name: native-x64
          path: |
            output/WeaselServer.exe
            output/weaselx64.dll
            work/build-*.log
  package:
    needs: [python-tests, manager, native]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WeaselSkinManager
          path: work/manager-dist/WeaselSkinManager/
      - uses: actions/download-artifact@v4
        with:
          name: native-x64
          path: .
      - shell: pwsh
        run: ./tools/package-extension.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rime-skins-x64-package
          path: work/packages/*.zip
